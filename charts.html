<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
__THEME__
  /* ---- the controls in the top bar ---- */
  .bar { flex-wrap: wrap; }
  .ctl { display: flex; gap: 3px; align-items: center; margin: 6px 0; }
  .ctl .name { margin-right: 4px; color: #d8efeb; font-weight: 600; }  /* on the teal bar */
  .ctl button { padding: 3px 9px; color: var(--fg); font: 600 12px var(--body); background: var(--bg); border: 1px solid var(--line);
                border-radius: 5px; cursor: pointer; }
  .ctl button:hover:not(.on) { background: var(--hover); }
  .ctl button.on { color: #fff; background: var(--accent-strong); border-color: var(--blue); }
  select { padding: 3px 6px; color: var(--fg); font: 500 12px var(--body); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
  select:focus { outline: 1px solid var(--blue); }
  .key { display: flex; gap: 8px; margin-left: auto; color: var(--fg); }
  .key > span { padding: 3px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
  .key i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }
  .key .them i { border: 1.6px solid var(--blue); border-radius: 50%; }
  .key .us i { background: var(--orange); border-radius: 1px; transform: rotate(45deg); }

  /* ---- the chart panels ---- */
  .pair { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 10px; }
  @media (max-width: 900px) { .pair { grid-template-columns: minmax(0, 1fr); } }
  .tile { min-width: 0; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px #0004; }
  .ttitle { margin-bottom: 2px; color: var(--fg); font: 700 17px/1.2 var(--head); text-transform: uppercase; letter-spacing: .02em; }
  .subtitle { margin-bottom: 8px; color: var(--dim); font-size: 12px; }
  /* how to read the chart, under it */
  .howto { position: relative; margin-top: 10px; padding: 8px 10px 8px 36px; color: var(--dim); font-size: 12px; line-height: 1.55;
           background: var(--row); border-radius: 8px; }
  .howto::before { content: "i"; position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; color: var(--bg);
                   font: 700 12px/18px var(--body); text-align: center; background: var(--blue); border-radius: 50%; }
  .howto b { color: var(--fg); font-weight: 600; }
  .howto .us { color: var(--orange); font-weight: 600; } .howto .them { color: #ff7ab5; font-weight: 600; }
  .howto .good { color: var(--green); font-weight: 600; } .howto .bad { color: var(--red); font-weight: 600; }
  .note { margin-bottom: 4px; color: var(--dim); font-size: 12px; }
  .note b { color: var(--fg); font-weight: normal; }
  svg { display: block; width: 100%; overflow: visible; font: 11px var(--body); }
  .ticks text { fill: var(--dim); }
  .gridline { stroke: var(--line); stroke-opacity: .45; }
  .pos { fill: var(--purple); font-size: 12px; cursor: pointer; }
  .pos.on { fill: var(--cyan); font-weight: 700; }
  .count { fill: var(--dim); }
  .lead { font-size: 12px; font-weight: 700; } .lead.up { fill: var(--green); } .lead.down { fill: var(--red); }
  .stripe { fill: #ffffff05; }
  .spread { stroke: #ff7ab566; stroke-width: 2; }
  .middle-half { fill: #ff3d9640; stroke: #ff3d96; stroke-width: 1; }
  .middle { fill: #fff; }
  .middle-value { fill: var(--fg); font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
  /* markers: the compared players as rings (ticks under a range), yours as orange diamonds; ringed white on hover */
  .mark { cursor: pointer; }
  .mark.them { fill: var(--bg); stroke: var(--blue); stroke-width: 1.6; }
  .mark.tick { fill: var(--blue); fill-opacity: .55; stroke: none; }
  .mark.us { fill: var(--orange); stroke: #141414; stroke-width: 1.5; }
  .mark.lit { fill-opacity: 1; stroke: var(--fg); stroke-width: 2; }
  .name-tag { fill: var(--orange); font-size: 10px; pointer-events: none; }
  .name-tag.them { fill: var(--fg); }
  .zone.good { fill: #4ade8014; } .zone.bad { fill: #f8717112; }
  .zone-line { stroke: var(--line); stroke-dasharray: 2 4; }
  .zone-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .zone-name.good { fill: #4ade80aa; } .zone-name.bad { fill: #f87171aa; }
  #tip { position: fixed; z-index: 5; display: none; padding: 10px 12px; font-size: 12px; line-height: 1.6; white-space: nowrap;
         background: #17191d; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px #000a; pointer-events: none; }
  #tip .who { color: var(--fg); font-size: 14px; font-weight: 700; }
  #tip .faint { color: var(--dim); }
  #tip .best { color: var(--cyan); font-weight: 600; }
  #tip .scores span { display: inline-block; margin: 2px 6px 2px 0; color: var(--dim); }
  #tip .scores b { color: var(--fg); font-weight: 600; }
  #tip .scores .top { padding: 0 6px; color: #fff; background: var(--accent-strong); border-radius: 5px; }
  #tip .scores .top b { color: #fff; }
</style>
</head>
<body>
<div class="bar">
  <span class="pages">__NAV__</span>
  <span class="ctl"><span class="name">compare with</span><select id="against"></select></span>
  <span class="ctl" id="positions"><span class="name">position</span></span>
  <span class="ctl"><span class="name">attribute</span><select id="attribute"></select></span>
  <span class="key"><span class="them"><i></i><span id="themName"></span> <span id="themCount"></span></span><span class="us"><i></i><span id="usName"></span> <span id="usCount"></span></span></span>
</div>
<div class="pair">
  <div class="tile"><div class="ttitle">Role score by position</div><div class="subtitle">How good your players are at each position, against the others</div>
    <div id="scoreChart"></div><div class="howto" id="scoreHow"></div></div>
  <div class="tile"><div class="ttitle" id="attributeTitle"></div><div class="subtitle" id="attributeSub"></div>
    <div id="attributeChart"></div><div class="howto" id="attributeHow"></div></div>
</div>
<div class="pair" id="plots"></div>
<div id="tip"></div>
<script>
// ---- the data: every player (yours flagged squad), each position's most important attributes ----
const MARKET = __DATA__, SITE = __SITE__;
const POSITIONS = MARKET.positions, PLAYERS = MARKET.players, CLUB = MARKET.managed;
const topAttributes = pos => MARKET.tops[pos] || [];

// whom yours are compared with: the latest import, everyone imported, or a division with a league-wide search (20+ rated)
const LATEST = "Last player import", EVERYONE = "All imported players", LEAGUE_SIZE = 20;
const perDivision = {};
for (const p of PLAYERS) if (p.division) perDivision[p.division] = (perDivision[p.division] || 0) + 1;
const CHOICES = [
  ...(PLAYERS.some(p => !p.squad && p.last) ? [LATEST] : []),
  ...(PLAYERS.some(p => !p.squad) ? [EVERYONE] : []),
  ...Object.keys(perDivision).filter(d => perDivision[d] >= LEAGUE_SIZE).sort(),
];
const shortName = d => d.replace(/^Sky Bet /, "");

// ---- what's chosen, kept between visits ----
const KEPT = "fm:__SAVE__:charts";
const choice = { pos: POSITIONS.find(p => p !== "GK") || POSITIONS[0], attr: "Acceleration", against: CHOICES[0] };
try {
  const old = JSON.parse(localStorage.getItem(KEPT) || "{}");  // an older version called these speed and division
  Object.assign(choice, { pos: old.pos ?? choice.pos, attr: old.attr ?? old.speed ?? choice.attr, against: old.against ?? old.division ?? choice.against });
} catch (e) {}
if (!POSITIONS.includes(choice.pos)) choice.pos = POSITIONS[0];
if (!CHOICES.includes(choice.against)) choice.against = CHOICES[0];
function choose(key, value) {
  choice[key] = value;
  try { localStorage.setItem(KEPT, JSON.stringify(choice)); } catch (e) {}
  draw();
}
const compared = p => !p.squad && (choice.against === EVERYONE || (choice.against === LATEST ? p.last : p.division === choice.against));
const shown = () => PLAYERS.filter(p => p.squad || compared(p));
const atBest = (p, pos) => p.best === pos && p.scores[pos] != null;  // each player counts at his best position

// ---- small helpers ----
const wageText = v => SITE.currency + (v >= 1e6 ? `${+(v / 1e6).toFixed(2)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(2)}K` : v);
const middleOf = values => quantile([...values].sort((a, b) => a - b), 0.5);
function quantile(sorted, f) {  // sorted ascending; f from 0 to 1, between neighbours where it falls between them
  const at = (sorted.length - 1) * f, lo = Math.floor(at), hi = Math.min(lo + 1, sorted.length - 1);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (at - lo);
}
function wobble(text) {  // a steady -0.5..0.5 per name, to spread markers that would sit on top of each other
  let h = 7;
  for (const ch of text) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return (h % 997) / 997 - 0.5;
}
function svgEl(tag, attrs, parent) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
function correlation(points) {  // Pearson's r, or null with too few points or no spread
  if (points.length < 3) return null;
  const n = points.length, mx = points.reduce((s, [a]) => s + a, 0) / n, my = points.reduce((s, [, b]) => s + b, 0) / n;
  let sab = 0, saa = 0, sbb = 0;
  for (const [a, b] of points) { sab += (a - mx) * (b - my); saa += (a - mx) ** 2; sbb += (b - my) ** 2; }
  return saa && sbb ? sab / Math.sqrt(saa * sbb) : null;
}

// ---- scales: value -> pixel, with tick values and how to write them ----
function padded(values, share) {
  const lo = Math.min(...values), hi = Math.max(...values), pad = (hi - lo) * share || 1;
  return [lo - pad, hi + pad];
}
function roundTicks(lo, hi, wanted = 5) {  // about `wanted` round numbers (steps of 1, 2, 2.5 or 5 × a power of ten)
  const base = 10 ** Math.floor(Math.log10((hi - lo) / wanted));
  const step = [1, 2, 2.5, 5, 10].map(m => m * base).find(s => (hi - lo) / s <= wanted) || hi - lo;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function straightScale(from, to, step) {
  const [a, b] = from, [p, q] = to;
  const scale = v => p + (v - a) / (b - a) * (q - p);
  scale.range = from;
  scale.label = v => String(+v.toFixed(2));
  scale.marks = () => {
    if (!step) return roundTicks(a, b);
    const marks = [];
    for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) marks.push(v);
    return marks;
  };
  return scale;
}
function wageScale(from, to) {  // wages spread over orders of magnitude: a log scale
  const [a, b] = from.map(Math.log), [p, q] = to;
  const scale = v => p + (Math.log(v) - a) / (b - a) * (q - p);
  scale.range = from;
  scale.label = wageText;
  scale.marks = () => [250, 500, 1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5].filter(t => t >= from[0] && t <= from[1]);
  return scale;
}
// tick marks and grid lines along one edge; `along` = the scale, `edge` = where the axis sits, `across` = how far lines reach
function ticks(svg, along, horizontal, edge, across, title) {
  const g = svgEl("g", { class: "ticks" }, svg);
  for (const t of along.marks()) {
    const at = along(t);
    if (horizontal) {
      svgEl("line", { x1: at, x2: at, y1: edge - across, y2: edge, class: "gridline" }, g);
      svgEl("text", { x: at, y: edge + 14, "text-anchor": "middle" }, g).textContent = along.label(t);
    } else {
      svgEl("line", { x1: edge, x2: edge + across, y1: at, y2: at, class: "gridline" }, g);
      svgEl("text", { x: edge - 6, y: at + 4, "text-anchor": "end" }, g).textContent = along.label(t);
    }
  }
  if (!title) return;
  const end = along(along.range[1]);
  svgEl("text", horizontal ? { x: end, y: edge + 28, "text-anchor": "end" } : { x: edge - 34, y: end - 8, "text-anchor": "start" }, g).textContent = title;
}

// ---- hover: a tooltip, and the player lit up on every chart ----
const tip = document.getElementById("tip");
function point(p, e) {
  document.querySelectorAll(".mark.lit").forEach(m => m.classList.remove("lit"));
  if (!p) { tip.style.display = "none"; return; }
  document.querySelectorAll(`.mark[data-name="${CSS.escape(p.name)}"]`).forEach(m => { m.classList.add("lit"); m.parentNode.appendChild(m); });
  const scores = Object.entries(p.scores).map(([pos, v]) =>
    `<span class="${pos === p.best ? "top" : ""}">${pos} <b>${v.toFixed(1)}</b></span>`).join("");
  const attrs = topAttributes(choice.pos).slice(0, 4).map(a => `${a.toLowerCase()} ${p.attrs[a] ?? "–"}`).join(" · ");
  tip.innerHTML = `<div class="who">${p.name}</div><div class="faint">${p.club} · ${p.age} · ${p.wage == null ? "–" : `${wageText(p.wage)} p/w`}` +
    ` · <span class="best">best as ${p.best}</span></div>` +
    `<div class="scores">${scores}</div>` +
    `<div>${p.rating == null ? "" : `rating ${p.rating.toFixed(2)} <span class="faint">in ${p.minutes} mins</span> · `}${attrs}</div>`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
  tip.style.left = `${Math.min(x, innerWidth - w - 8)}px`;
  tip.style.top = `${y + h > innerHeight ? e.clientY - h - 10 : y}px`;
}
function marker(svg, p, x, y, asTick) {
  const node = p.squad
    ? svgEl("rect", { x: x - 5, y: y - 5, width: 10, height: 10, rx: 1.5, transform: `rotate(45 ${x} ${y})`, class: "mark us", "data-name": p.name }, svg)
    : svgEl("circle", { cx: x, cy: y, r: asTick ? 2.6 : 4, class: `mark them${asTick ? " tick" : ""}`, "data-name": p.name }, svg);
  node.addEventListener("mousemove", e => point(p, e));
  node.addEventListener("mouseleave", () => point(null));
  return node;
}

// ---- by position: per position a range of the compared players and your players on it ----
// value(p, pos); counts(p, pos): whether p belongs in pos's row; floor: where the scale starts (lower values sit at it)
function byPosition(boxId, value, title, counts, step, labelMiddle, floor) {
  const box = document.getElementById(boxId);
  box.innerHTML = "";
  const width = box.clientWidth, row = 46, left = 64, right = 50, height = POSITIONS.length * row + 30;
  const everyone = shown();
  const lines = POSITIONS.map(pos => ({ pos, people: everyone.filter(p => counts(p, pos) && value(p, pos) != null) }));
  if (!lines.some(l => l.people.length)) return;
  const values = POSITIONS.flatMap(pos => everyone.filter(p => counts(p, pos)).map(p => value(p, pos))).filter(v => v != null);
  const [lo, hi] = padded(values, 0.04), scale = straightScale([floor ?? lo, hi], [left, width - right], step);
  const x = v => scale(Math.max(v, scale.range[0]));
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height }, box);
  ticks(svg, scale, true, height - 24, height - 24, title);
  const endText = (y, text, cls) => { svgEl("text", { x: width, y: y + 4, "text-anchor": "end", class: cls }, svg).textContent = text; };
  lines.forEach(({ pos, people }, i) => {
    const y = i * row + row / 2, them = people.filter(p => !p.squad), us = people.filter(p => p.squad);
    if (i % 2) svgEl("rect", { x: left - 6, y: y - row / 2, width: width - left - right + 12, height: row, class: "stripe" }, svg);
    const name = svgEl("text", { x: 0, y: y + 4, class: `pos${pos === choice.pos ? " on" : ""}` }, svg);
    name.textContent = pos;
    name.addEventListener("click", () => choose("pos", pos));
    if (!them.length) endText(y, "–", "count");
    else {
      const sorted = them.map(p => value(p, pos)).sort((a, b) => a - b), mid = quantile(sorted, 0.5);
      const q1 = x(quantile(sorted, 0.25)), q3 = x(quantile(sorted, 0.75));
      svgEl("line", { x1: x(sorted[0]), x2: x(sorted[sorted.length - 1]), y1: y, y2: y, class: "spread" }, svg);
      svgEl("rect", { x: q1, y: y - 7, width: Math.max(2, q3 - q1), height: 14, rx: 4, class: "middle-half" }, svg);
      svgEl("rect", { x: x(mid) - 1.5, y: y - 10, width: 3, height: 20, rx: 1.5, class: "middle" }, svg);
      if (labelMiddle) svgEl("text", { x: x(mid), y: y - 13, "text-anchor": "middle", class: "middle-value" }, svg).textContent = mid.toFixed(1);
      them.forEach(p => marker(svg, p, x(value(p, pos)), y + 15, true));
      if (us.length) {
        const lead = Math.max(...us.map(p => value(p, pos))) - mid;
        endText(y, `${lead >= 0 ? "+" : "−"}${Math.abs(lead).toFixed(1)}`, `lead ${lead >= 0 ? "up" : "down"}`);
      } else endText(y, String(them.length), "count");
    }
    us.forEach(p => marker(svg, p, x(value(p, pos)), y));
  });
}

// ---- two values against each other, at the chosen position ----
function plot({ title, x: getX, y: getY, xTitle, yTitle, wages, zones, spreadX, howto }) {
  const panel = document.createElement("div");
  panel.className = "tile";
  document.getElementById("plots").appendChild(panel);
  const has = p => atBest(p, choice.pos) && getX(p) != null && getY(p) != null;
  const people = shown().filter(has), them = people.filter(p => !p.squad), us = people.filter(p => p.squad);
  const r = correlation(them.filter(compared).map(p => [wages ? Math.log(getX(p)) : getX(p), getY(p)]));
  panel.innerHTML = `<div class="ttitle">${title}</div><div class="note">${them.length} ${shortName(choice.against)}` +
    `${us.length ? ` + ${us.length} ${CLUB}` : ""}${r == null ? "" : ` · r = <b>${r.toFixed(2)}</b>`}</div>`;
  if (!people.length) return;
  const box = document.createElement("div");
  panel.appendChild(box);
  if (howto) {  // how to read it, under the chart
    const how = document.createElement("div");
    how.className = "howto";
    how.innerHTML = howto;
    panel.appendChild(how);
  }
  const width = box.clientWidth, height = Math.max(240, Math.min(360, width * 0.62)), left = 40, bottom = 34, top = 14, right = 10;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height }, box);
  const xs = people.map(getX), ys = people.map(getY);
  const sx = wages ? wageScale([Math.min(...xs) / 1.25, Math.max(...xs) * 1.25], [left, width - right]) : straightScale(padded(xs, 0.05), [left, width - right]);
  const sy = straightScale(padded(ys, 0.06), [height - bottom, top]);
  ticks(svg, sx, true, height - bottom, height - bottom - top, xTitle);
  ticks(svg, sy, false, left, width - left - right, yTitle);
  if (zones && them.length >= 3) {  // four zones split at the compared players' middle: top left is the value
    const mx = sx(middleOf(them.map(getX))), my = sy(middleOf(them.map(getY)));
    svgEl("rect", { x: left, y: top, width: Math.max(0, mx - left), height: Math.max(0, my - top), class: "zone good" }, svg);
    svgEl("rect", { x: mx, y: my, width: Math.max(0, width - right - mx), height: Math.max(0, height - bottom - my), class: "zone bad" }, svg);
    svgEl("line", { x1: mx, x2: mx, y1: top, y2: height - bottom, class: "zone-line" }, svg);
    svgEl("line", { x1: left, x2: width - right, y1: my, y2: my, class: "zone-line" }, svg);
    svgEl("text", { x: left + 6, y: top + 12, class: "zone-name good" }, svg).textContent = zones[0];
    svgEl("text", { x: width - right - 6, y: height - bottom - 6, "text-anchor": "end", class: "zone-name bad" }, svg).textContent = zones[1];
  }
  const px = p => sx(getX(p) + (spreadX ? spreadX * wobble(p.name) : 0)), py = p => sy(getY(p));
  [...them, ...us].forEach(p => marker(svg, p, px(p), py(p)));
  // names: all of yours and the compared players' best three, beside the marker where there's room
  const best = [...them].sort((a, b) => getY(b) - getY(a)).slice(0, 3), taken = [];
  for (const p of [...us, ...best]) {
    const cx = px(p), cy = py(p), text = p.name.split(" ").pop(), w = text.length * 6.2 + 2;
    const spot = [[cx + 7, cx + 7 + w], [cx - 7 - w, cx - 7]].find(([a, b]) => a >= left && b <= width &&
      !taken.some(([ta, tb, ty]) => a < tb && b > ta && Math.abs(ty - cy) < 11));
    if (!spot) continue;
    taken.push([...spot, cy]);
    svgEl("text", { x: spot[0], y: cy + 3, class: `name-tag${p.squad ? "" : " them"}` }, svg).textContent = text;
  }
}

// ---- putting the page together ----
function fillSelect(id, options, current, key) {
  const sel = document.getElementById(id);
  sel.innerHTML = options.map(([value, text]) => `<option value="${value}"${value === current ? " selected" : ""}>${text}</option>`).join("");
  sel.onchange = () => choose(key, sel.value);
}
function draw() {
  fillSelect("against", CHOICES.map(c => [c, shortName(c)]), choice.against, "against");
  const attrs = topAttributes(choice.pos);
  if (!attrs.includes(choice.attr)) choice.attr = attrs[0];
  fillSelect("attribute", attrs.map((a, i) => [a, `${i + 1}. ${a}`]), choice.attr, "attr");
  const bar = document.getElementById("positions");
  bar.querySelectorAll("button").forEach(b => b.remove());
  for (const pos of POSITIONS) {
    const b = document.createElement("button");
    b.textContent = pos;
    b.className = pos === choice.pos ? "on" : "";
    b.onclick = () => choose("pos", pos);
    bar.appendChild(b);
  }
  const people = shown();
  document.getElementById("themName").textContent = shortName(choice.against);
  document.getElementById("themCount").textContent = people.filter(p => !p.squad).length;
  document.getElementById("usName").textContent = CLUB;
  document.getElementById("usCount").textContent = people.filter(p => p.squad).length;
  const attr = choice.attr, pos = choice.pos, attrOf = p => p.attrs[attr], scoreOf = p => p.scores[pos];
  document.getElementById("attributeTitle").textContent = `${attr} by position`;
  document.getElementById("attributeSub").textContent = `Your players' ${attr.toLowerCase()} at each position, against the others (pick the attribute at the top)`;
  const them = `<span class="them">${shortName(choice.against)}</span>`, us = `<span class="us">◆ your players</span>`;
  document.getElementById("scoreHow").innerHTML = `Each row is a position. The pink bar is ${them}: the line runs from the worst to the best, ` +
    `the box holds the middle half, and the white mark and number are the middle player. ${us} sit on top: right of the white mark = ` +
    `better than most of them. The number at the far right is your best minus their middle (<span class="good">green</span> = you're ahead).`;
  document.getElementById("attributeHow").innerHTML = `Read it like the chart beside it, for one attribute: further right = more ${attr.toLowerCase()}. ` +
    `Pick another attribute in the menu at the top; hover a mark for the player.`;
  byPosition("scoreChart", (p, at) => p.scores[at], "role score", atBest, undefined, true, 10);
  byPosition("attributeChart", p => attrOf(p), attr, (p, at) => p.best === at, 2);
  document.getElementById("plots").innerHTML = "";
  plot({ title: `${pos} score vs wage`, x: p => p.wage || null, y: scoreOf, xTitle: "wage p/w (log)", yTitle: `${pos} score`, wages: true,
         zones: ["better and cheaper", "worse and dearer"],
         howto: `Every player at ${pos}: <b>higher = better</b>, <b>further left = cheaper</b>. The dashed lines are the middle of the others. ` +
                `<span class="good">Top left</span>: better and cheaper than most (good value: worth a look). ` +
                `<span class="bad">Bottom right</span>: worse and dearer. Hover a mark for the player.` });
  if (people.some(p => p.rating != null)) {
    plot({ title: `${pos} score vs average rating`, x: p => p.rating, y: scoreOf, xTitle: "average rating", yTitle: `${pos} score`,
           howto: `Does a higher score mean better matches? Marks rising to the right (r near 1) say yes; a flat cloud (r near 0) says the score misses something.` });
    plot({ title: `${attr} vs average rating`, x: attrOf, y: p => p.rating, xTitle: attr, yTitle: "rating", spreadX: 0.35,
           howto: `Does more ${attr.toLowerCase()} go with better match ratings at ${pos}? The higher r, the more it does.` });
  } else {
    const panel = document.createElement("div");
    panel.className = "tile";
    panel.innerHTML = `<div class="ttitle">Score vs average rating</div><div class="note">These charts appear once you import a whole ` +
      `division with Division, Minutes and Average Rating columns (rename the export after the league, e.g. league-one.csv).</div>`;
    document.getElementById("plots").appendChild(panel);
  }
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  const page = SITE.pages[e.key];
  if (page && page !== "charts") location.href = `${page}.html`;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {  // the previous or next position, round the end
    const n = POSITIONS.length, i = POSITIONS.indexOf(choice.pos) + (e.key === "ArrowRight" ? 1 : -1);
    choose("pos", POSITIONS[(i + n) % n]);
  }
});
let redraw;
addEventListener("resize", () => { clearTimeout(redraw); redraw = setTimeout(draw, 150); });
draw();
</script>
