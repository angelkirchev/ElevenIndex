<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__FONTS__</style>
<style>
__THEME__
  /* ---- the controls in the top bar ---- */
  .bar { flex-wrap: wrap; }
  .ctl { display: flex; gap: 3px; align-items: center; margin: 6px 0; }
  .ctl .name { margin-right: 4px; color: var(--sub-ink); font-weight: 600; }  /* in the strip under the bar */
  .subnav.rctl { flex-wrap: wrap; align-items: center; gap: 4px 18px; padding: 3px 14px 3px 64px; }
  .ctl button { padding: 3px 9px; color: var(--fg); font: 600 12px var(--body); background: var(--bg); border: 1px solid var(--line);
                border-radius: 5px; cursor: pointer; }
  .ctl button:hover:not(.on) { background: var(--hover); }
  .ctl button.on { color: #0f1412; background: var(--accent-strong); border-color: var(--blue); }
  select { padding: 3px 6px; color: var(--fg); font: 500 12px var(--body); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
  select:focus { outline: 1px solid var(--blue); }
  .key { display: flex; gap: 8px; margin-left: auto; color: var(--fg); }
  .key > span { padding: 3px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
  .key i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }
  .key .them i { border: 1.6px solid var(--blue); border-radius: 50%; }
  .key .us i { background: var(--orange); border-radius: 1px; transform: rotate(45deg); }

  /* ---- the analysis on top, then the chart panel ---- */
  .tile { margin-bottom: 10px; }
  .tile { min-width: 0; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px #0004; }
  .ttitle { margin-bottom: 2px; color: var(--fg); font: 700 17px/1.2 var(--head); text-transform: uppercase; letter-spacing: .02em; }
  .subtitle { margin-bottom: 8px; color: var(--dim); font-size: 12px; }
  /* how to read the chart, under it */
  .howto { position: relative; margin-top: 10px; padding: 8px 10px 8px 36px; color: var(--dim); font-size: 12px; line-height: 1.55;
           background: var(--row); border-radius: 8px; }
  .howto::before { content: "i"; position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; color: var(--bg);
                   font: 700 12px/18px var(--body); text-align: center; background: var(--blue); border-radius: 50%; }
  .howto b { color: var(--fg); font-weight: 600; }
  .howto .us { color: var(--orange); font-weight: 600; } .howto .them { color: var(--blue); font-weight: 600; }
  .howto .good { color: var(--green); font-weight: 600; } .howto .bad { color: var(--red); font-weight: 600; }
  .chead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .chead .pick { display: flex; gap: 6px; align-items: center; color: var(--dim); font-weight: 600; }
  .chead .pick select { padding: 4px 8px; font-size: 13px; }
  .lead-line { margin: 4px 0 10px; color: var(--fg); font-size: 13px; line-height: 1.6; }
  .lead-line b { font-weight: 600; } .lead-line .good { color: var(--green); } .lead-line .bad { color: var(--red); }
  table.market { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.market th { padding: 6px 8px; color: var(--dim); font-weight: 600; font-size: 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.market td { padding: 6px 8px; border-bottom: 1px solid #ffffff0a; white-space: nowrap; }
  table.market th.num, table.market td.num { text-align: right; }
  table.market tbody tr { cursor: pointer; }
  table.market tbody tr:nth-child(even) { background: var(--row); }
  table.market tbody tr:hover { background: var(--hover); }
  table.market tbody tr.on { box-shadow: inset 3px 0 0 var(--blue); background: color-mix(in srgb, var(--blue) 8%, transparent); }
  table.market .pos-cell { color: var(--purple); font-weight: 700; }
  table.market tr.on .pos-cell { color: var(--cyan); }
  table.market .faint { color: var(--dim); font-size: 12px; }
  table.market .up { color: var(--green); font-weight: 600; } table.market .down { color: var(--red); font-weight: 600; }
  table.market .us { color: var(--orange); }
  .wrapx { overflow-x: auto; }
  .note { margin-bottom: 4px; color: var(--dim); font-size: 12px; }
  .note b { color: var(--fg); font-weight: normal; }
  svg { display: block; width: 100%; overflow: visible; font: 11px var(--body); }
  .ticks text { fill: var(--dim); }
  .gridline { stroke: var(--line); stroke-opacity: .45; }
  .pos { fill: var(--purple); font-size: 13px; font-weight: 600; cursor: pointer; }
  .pos.on { fill: var(--cyan); font-weight: 700; }
  .count { fill: var(--dim); }
  .lead { font-size: 12px; font-weight: 700; } .lead.up { fill: var(--green); } .lead.down { fill: var(--red); }
  .stripe { fill: #ffffff05; }
  /* by position: one band per position (two lanes), the label on its own strip, your best big and named */
  .band { fill: #ffffff03; } .band.odd { fill: #ffffff0a; } .rowline { stroke: #ffffff1f; stroke-width: 1; }
  .poscell { fill: #00000033; } .poscell.on { fill: color-mix(in srgb, var(--blue) 14%, transparent); }
  .toptick { fill: var(--dim); font-size: 11px; }
  .mark.us.faint { opacity: .45; }
  .mark.us.best { stroke: #fff; stroke-width: 1.6; }
  .bestname { fill: var(--orange); font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #0f1412; stroke-width: 3px; }
  .spread { stroke: #dff79a66; stroke-width: 2; }
  .middle-half { fill: color-mix(in srgb, var(--blue) 25%, transparent); stroke: var(--blue); stroke-width: 1; }
  .middle { fill: #fff; }
  .middle-value { fill: var(--fg); font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
  /* markers: the compared players as rings (ticks under a range), yours as orange diamonds; ringed white on hover */
  .mark { cursor: pointer; }
  .mark.them { fill: var(--bg); stroke: var(--blue); stroke-width: 1.6; }
  .mark.tick { fill: var(--blue); fill-opacity: .55; stroke: none; }
  .mark.us { fill: var(--orange); stroke: #141414; stroke-width: 1.5; }
  .advice { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; }
  .advice.bad { color: var(--red); border-color: #f8717166; } .advice.warn { color: var(--yellow); border-color: #fbd13d55; }
  .advice.good { color: var(--green); border-color: #4ade8066; } .advice.ok { color: var(--dim); }
  .mark.lit { fill-opacity: 1; stroke: var(--fg); stroke-width: 2; }
  .name-tag { fill: var(--orange); font-size: 10px; pointer-events: none; }
  .name-tag.them { fill: var(--fg); }
  .zone.good { fill: #4ade8014; } .zone.bad { fill: #f8717112; }
  .zone-line { stroke: var(--line); stroke-dasharray: 2 4; }
  .zone-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .zone-name.good { fill: #4ade80aa; } .zone-name.bad { fill: #f87171aa; }
  #tip { position: fixed; z-index: 5; display: none; padding: 10px 12px; font-size: 12px; line-height: 1.6; white-space: nowrap;
         background: var(--pop); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px #000a; pointer-events: none; }
  #tip .who { color: var(--fg); font-size: 14px; font-weight: 700; }
  #tip .faint { color: var(--dim); }
  #tip .best { color: var(--cyan); font-weight: 600; }
  #tip .scores span { display: inline-block; margin: 2px 6px 2px 0; color: var(--dim); }
  #tip .scores b { color: var(--fg); font-weight: 600; }
  #tip .scores .top { padding: 0 6px; color: #0f1412; background: var(--accent-strong); border-radius: 5px; }
  #tip .scores .top b { color: #0f1412; }
</style>
</head>
<body>
<div class="bar">
  <span class="pages">__NAV__</span>
  __PROMO__
</div>
<!-- Research's choices, in the strip under the bar (where Squad, Players and Staff have their sub-tabs) -->
<div class="subnav rctl">
  <span class="ctl"><span class="name">compare with</span><select id="against"></select></span>
  <span class="ctl" id="positions"><span class="name">position</span></span>
  <span class="key"><span class="them"><i></i><span id="themName"></span> <span id="themCount"></span></span><span class="us"><i></i><span id="usName"></span> <span id="usCount"></span></span></span>
</div>
<div class="tile" id="summary"></div>
<div class="tile">
  <div class="chead"><span class="ttitle" id="chartTitle"></span><span class="pick">Graph <select id="chart"></select></span></div>
  <div class="subtitle" id="chartSub"></div>
  <div id="chartBox"></div>
  <div class="howto" id="chartHow"></div>
</div>
<div id="tip"></div>
<script>
// ---- the data: every player (yours flagged squad), each position's most important attributes ----
const MARKET = __DATA__, SITE = __SITE__;
const POSITIONS = MARKET.positions, PLAYERS = MARKET.players, CLUB = MARKET.managed;
const topAttributes = pos => MARKET.tops[pos] || [];
// a player's Technical / Mental / Physical / Goalkeeping value at a position: the group's attributes averaged with the
// position's weights (as on the Attributes page); null when the group has no weight there or under half of it is known
function groupValue(p, pos, group) {
  const w = MARKET.weights[pos] || {};
  let total = 0, known = 0, sum = 0;
  for (const a of MARKET.groups[group]) {
    if (!w[a]) continue;
    total += w[a];
    if (p.attrs[a] != null) { known += w[a]; sum += p.attrs[a] * w[a]; }
  }
  return total && known >= total / 2 ? sum / known : null;
}

// whom yours are compared with: the latest import, everyone imported, or your own squad by age
const LATEST = "Last player import", EVERYONE = "All imported players";
const CHOICES = [
  ...(PLAYERS.some(p => !p.squad && p.last) ? [LATEST] : []),
  ...(PLAYERS.some(p => !p.squad) ? [EVERYONE] : []),
];
const shortName = d => d.replace(/^Sky Bet /, "");

// ---- what's chosen, kept between visits ----
const KEPT = "fm:__SAVE__:charts";
const choice = { pos: POSITIONS.find(p => p !== "GK") || POSITIONS[0], against: CHOICES[0], chart: "score" };
try {
  const old = JSON.parse(localStorage.getItem(KEPT) || "{}");  // an older version called these speed and division
  Object.assign(choice, { pos: old.pos ?? choice.pos, against: old.against ?? old.division ?? choice.against,
                          chart: old.chart ?? choice.chart });
} catch (e) {}
if (choice.pos === "DC") choice.pos = "CD";  // the centre-back used to be called DC
if (!POSITIONS.includes(choice.pos)) choice.pos = POSITIONS[0];
if (!CHOICES.includes(choice.against)) choice.against = CHOICES[0];
function choose(key, value) {
  choice[key] = value;
  try { localStorage.setItem(KEPT, JSON.stringify(choice)); } catch (e) {}
  draw();
}
const compared = p => !p.squad && (choice.against === EVERYONE || choice.against === LATEST && p.last);
const shown = () => PLAYERS.filter(p => p.squad || compared(p));  // in age mode: your squad only
const atBest = (p, pos) => p.best === pos && p.scores[pos] != null;  // each player counts at his best position

// ---- small helpers ----
const wageText = v => SITE.currency + (v >= 1e6 ? `${+(v / 1e6).toFixed(2)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(2)}K` : v);
const middleOf = values => quantile([...values].sort((a, b) => a - b), 0.5);
function quantile(sorted, f) {  // sorted ascending; f from 0 to 1, between neighbours where it falls between them
  const at = (sorted.length - 1) * f, lo = Math.floor(at), hi = Math.min(lo + 1, sorted.length - 1);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (at - lo);
}
function wobble(text) {  // a steady -0.5..0.5 per name, to spread markers that would sit on top of each other
  let h = 7;
  for (const ch of text) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return (h % 997) / 997 - 0.5;
}
function svgEl(tag, attrs, parent) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
function correlation(points) {  // Pearson's r, or null with too few points or no spread
  if (points.length < 3) return null;
  const n = points.length, mx = points.reduce((s, [a]) => s + a, 0) / n, my = points.reduce((s, [, b]) => s + b, 0) / n;
  let sab = 0, saa = 0, sbb = 0;
  for (const [a, b] of points) { sab += (a - mx) * (b - my); saa += (a - mx) ** 2; sbb += (b - my) ** 2; }
  return saa && sbb ? sab / Math.sqrt(saa * sbb) : null;
}

// ---- scales: value -> pixel, with tick values and how to write them ----
function padded(values, share) {
  const lo = Math.min(...values), hi = Math.max(...values), pad = (hi - lo) * share || 1;
  return [lo - pad, hi + pad];
}
function roundTicks(lo, hi, wanted = 5) {  // about `wanted` round numbers (steps of 1, 2, 2.5 or 5 × a power of ten)
  const base = 10 ** Math.floor(Math.log10((hi - lo) / wanted));
  const step = [1, 2, 2.5, 5, 10].map(m => m * base).find(s => (hi - lo) / s <= wanted) || hi - lo;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function straightScale(from, to, step) {
  const [a, b] = from, [p, q] = to;
  const scale = v => p + (v - a) / (b - a) * (q - p);
  scale.range = from;
  scale.label = v => String(+v.toFixed(2));
  scale.marks = () => {
    if (!step) return roundTicks(a, b);
    const marks = [];
    for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) marks.push(v);
    return marks;
  };
  return scale;
}
function wageScale(from, to) {  // wages spread over orders of magnitude: a log scale
  const [a, b] = from.map(Math.log), [p, q] = to;
  const scale = v => p + (Math.log(v) - a) / (b - a) * (q - p);
  scale.range = from;
  scale.label = wageText;
  scale.marks = () => [250, 500, 1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5].filter(t => t >= from[0] && t <= from[1]);
  return scale;
}
// tick marks and grid lines along one edge; `along` = the scale, `edge` = where the axis sits, `across` = how far lines reach
function ticks(svg, along, horizontal, edge, across, title) {
  const g = svgEl("g", { class: "ticks" }, svg);
  for (const t of along.marks()) {
    const at = along(t);
    if (horizontal) {
      svgEl("line", { x1: at, x2: at, y1: edge - across, y2: edge, class: "gridline" }, g);
      svgEl("text", { x: at, y: edge + 14, "text-anchor": "middle" }, g).textContent = along.label(t);
    } else {
      svgEl("line", { x1: edge, x2: edge + across, y1: at, y2: at, class: "gridline" }, g);
      svgEl("text", { x: edge - 6, y: at + 4, "text-anchor": "end" }, g).textContent = along.label(t);
    }
  }
  if (!title) return;
  const end = along(along.range[1]);
  svgEl("text", horizontal ? { x: end, y: edge + 28, "text-anchor": "end" } : { x: edge - 34, y: end - 8, "text-anchor": "start" }, g).textContent = title;
}

// ---- hover: a tooltip, and the player lit up on every chart ----
const tip = document.getElementById("tip");
function point(p, e) {
  document.querySelectorAll(".mark.lit").forEach(m => m.classList.remove("lit"));
  if (!p) { tip.style.display = "none"; return; }
  document.querySelectorAll(`.mark[data-name="${CSS.escape(p.name)}"]`).forEach(m => { m.classList.add("lit"); m.parentNode.appendChild(m); });
  const scores = Object.entries(p.scores).map(([pos, v]) =>
    `<span class="${pos === p.best ? "top" : ""}">${pos} <b>${v.toFixed(1)}</b></span>`).join("");
  const attrs = topAttributes(choice.pos).slice(0, 4).map(a => `${a.toLowerCase()} ${p.attrs[a] ?? "–"}`).join(" · ");
  tip.innerHTML = `<div class="who">${p.name}</div><div class="faint">${p.club} · ${p.age} · ${p.wage == null ? "–" : `${wageText(p.wage)} p/w`}` +
    ` · <span class="best">best as ${p.best}</span></div>` +
    `<div class="scores">${scores}</div>` +
    `<div>${p.rating == null ? "" : `rating ${p.rating.toFixed(2)}${p.minutes ? ` <span class="faint">in ${p.minutes} mins</span>` : ""} · `}${attrs}</div>`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
  tip.style.left = `${Math.min(x, innerWidth - w - 8)}px`;
  tip.style.top = `${y + h > innerHeight ? e.clientY - h - 10 : y}px`;
}
function marker(svg, p, x, y, asTick) {
  const node = p.squad
    ? svgEl("rect", { x: x - 5, y: y - 5, width: 10, height: 10, rx: 1.5, transform: `rotate(45 ${x} ${y})`, class: "mark us", "data-name": p.name }, svg)
    : svgEl("circle", { cx: x, cy: y, r: asTick ? 2.6 : 4, class: `mark them${asTick ? " tick" : ""}`, "data-name": p.name }, svg);
  node.addEventListener("mousemove", e => point(p, e));
  node.addEventListener("mouseleave", () => point(null));
  return node;
}

// ---- by position: per position a range of the compared players and your players on it ----
// value(p, pos); counts(p, pos): whether p belongs in pos's row; floor: where the scale starts (lower values sit at it)
function byPosition(boxId, value, title, counts, step, labelMiddle, floor, only) {
  // each position is one band with two lanes: on top the players you compare with (their range, the middle half, the
  // middle, a tick each), below your players (small faded diamonds, your best big with his name and score)
  const POSITIONS = only || MARKET.positions;  // only: just these rows (Goalkeeping: GK)
  const box = document.getElementById(boxId);
  box.innerHTML = "";
  const width = box.clientWidth, row = 64, top = 26, left = 78, right = 56, height = top + POSITIONS.length * row + 34;
  const everyone = shown();
  const lines = POSITIONS.map(pos => ({ pos, people: everyone.filter(p => counts(p, pos) && value(p, pos) != null) }));
  if (!lines.some(l => l.people.length)) return;
  const values = POSITIONS.flatMap(pos => everyone.filter(p => counts(p, pos)).map(p => value(p, pos))).filter(v => v != null);
  const [lo, hi] = padded(values, 0.04), scale = straightScale([floor ?? lo, hi], [left, width - right], step);
  const x = v => scale(Math.max(v, scale.range[0]));
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height }, box);
  const bottom = top + POSITIONS.length * row;
  // the bands first, so the grid and marks sit on them
  lines.forEach(({ pos }, i) => {
    const y0 = top + i * row;
    svgEl("rect", { x: left - 8, y: y0, width: width - left - right + 16, height: row, class: i % 2 ? "band odd" : "band" }, svg);
    svgEl("rect", { x: 0, y: y0, width: left - 12, height: row, rx: 0, class: `poscell${pos === choice.pos ? " on" : ""}` }, svg);
    if (i) svgEl("line", { x1: 0, x2: width, y1: y0, y2: y0, class: "rowline" }, svg);
  });
  ticks(svg, scale, true, bottom + 4, bottom - top + 4, title);
  for (const t of scale.marks())  // the scale at the top too
    svgEl("text", { x: scale(t), y: top - 9, "text-anchor": "middle", class: "toptick" }, svg).textContent = scale.label(t);
  const endText = (y, text, cls) => { svgEl("text", { x: width - 4, y: y + 4, "text-anchor": "end", class: cls }, svg).textContent = text; };
  lines.forEach(({ pos, people }, i) => {
    const y0 = top + i * row, laneThem = y0 + 22, laneUs = y0 + 47, mid0 = y0 + row / 2;
    const them = people.filter(p => !p.squad), us = people.filter(p => p.squad);
    const name = svgEl("text", { x: 12, y: mid0 + 4, class: `pos${pos === choice.pos ? " on" : ""}` }, svg);
    name.textContent = pos;
    name.addEventListener("click", () => choose("pos", pos));
    let mid = null;
    if (them.length) {
      const sorted = them.map(p => value(p, pos)).sort((a, b) => a - b);
      mid = quantile(sorted, 0.5);
      const q1 = x(quantile(sorted, 0.25)), q3 = x(quantile(sorted, 0.75));
      svgEl("line", { x1: x(sorted[0]), x2: x(sorted[sorted.length - 1]), y1: laneThem, y2: laneThem, class: "spread" }, svg);
      svgEl("rect", { x: q1, y: laneThem - 7, width: Math.max(2, q3 - q1), height: 14, rx: 4, class: "middle-half" }, svg);
      svgEl("rect", { x: x(mid) - 1.5, y: laneThem - 10, width: 3, height: 20, rx: 1.5, class: "middle" }, svg);
      if (labelMiddle) svgEl("text", { x: x(mid), y: laneThem - 13, "text-anchor": "middle", class: "middle-value" }, svg).textContent = mid.toFixed(1);
      them.forEach(p => marker(svg, p, x(value(p, pos)), laneThem + 10, true));
    }
    if (us.length) {
      const best = us.reduce((a, b) => value(b, pos) > value(a, pos) ? b : a);
      us.filter(p => p !== best).forEach(p => marker(svg, p, x(value(p, pos)), laneUs).classList.add("faint"));
      const bx = x(value(best, pos)), m = marker(svg, best, bx, laneUs);
      m.classList.add("best");
      for (const [k, v] of Object.entries({ x: bx - 7, y: laneUs - 7, width: 14, height: 14 })) m.setAttribute(k, v);  // bigger
      const label = svgEl("text", { x: bx + 10, y: laneUs + 4, class: "bestname" }, svg);
      label.textContent = `${best.name.split(" ").pop()} ${value(best, pos).toFixed(1)}`;
      if (bx + 10 + label.getComputedTextLength() > width - right) { label.setAttribute("x", bx - 10); label.setAttribute("text-anchor", "end"); }
    }
    if (mid != null && us.length) {
      const lead = Math.max(...us.map(p => value(p, pos))) - mid;
      endText(mid0, `${lead >= 0 ? "+" : "−"}${Math.abs(lead).toFixed(1)}`, `lead ${lead >= 0 ? "up" : "down"}`);
    } else endText(mid0, them.length ? String(them.length) : "–", "count");
  });
}

// ---- two values against each other, at the chosen position ----
function plot({ x: getX, y: getY, xTitle, yTitle, wages, zones, spreadX, who }) {  // who: which players (else those best at the position)
  const box = document.getElementById("chartBox");
  box.innerHTML = "";
  const has = p => (who ? who(p) : atBest(p, choice.pos)) && getX(p) != null && getY(p) != null;
  const people = shown().filter(has), them = people.filter(p => !p.squad), us = people.filter(p => p.squad);
  const r = correlation(them.filter(compared).map(p => [wages ? Math.log(getX(p)) : getX(p), getY(p)]));
  const note = document.createElement("div");
  note.className = "note";
  note.innerHTML = (who ? `${us.length} of your players, each at his best position` : `${them.length} ${shortName(choice.against)}${us.length ? ` + ${us.length} ${CLUB}` : ""} at ${choice.pos}`) +
    `${r == null ? "" : ` · r = <b>${r.toFixed(2)}</b>`}`;
  box.appendChild(note);
  if (!people.length) return;
  const width = box.clientWidth, height = Math.max(260, Math.min(440, width * 0.5)), left = 40, bottom = 34, top = 14, right = 10;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height }, box);
  const xs = people.map(getX), ys = people.map(getY);
  const sx = wages ? wageScale([Math.min(...xs) / 1.25, Math.max(...xs) * 1.25], [left, width - right]) : straightScale(padded(xs, 0.05), [left, width - right]);
  const sy = straightScale(padded(ys, 0.06), [height - bottom, top]);
  ticks(svg, sx, true, height - bottom, height - bottom - top, xTitle);
  ticks(svg, sy, false, left, width - left - right, yTitle);
  if (zones && them.length >= 3) {  // four zones split at the compared players' middle: top left is the value
    const mx = sx(middleOf(them.map(getX))), my = sy(middleOf(them.map(getY)));
    svgEl("rect", { x: left, y: top, width: Math.max(0, mx - left), height: Math.max(0, my - top), class: "zone good" }, svg);
    svgEl("rect", { x: mx, y: my, width: Math.max(0, width - right - mx), height: Math.max(0, height - bottom - my), class: "zone bad" }, svg);
    svgEl("line", { x1: mx, x2: mx, y1: top, y2: height - bottom, class: "zone-line" }, svg);
    svgEl("line", { x1: left, x2: width - right, y1: my, y2: my, class: "zone-line" }, svg);
    svgEl("text", { x: left + 6, y: top + 12, class: "zone-name good" }, svg).textContent = zones[0];
    svgEl("text", { x: width - right - 6, y: height - bottom - 6, "text-anchor": "end", class: "zone-name bad" }, svg).textContent = zones[1];
  }
  const px = p => sx(getX(p) + (spreadX ? spreadX * wobble(p.name) : 0)), py = p => sy(getY(p));
  [...them, ...us].forEach(p => marker(svg, p, px(p), py(p)));
  // names: all of yours and the compared players' best three, beside the marker where there's room
  const best = [...them].sort((a, b) => getY(b) - getY(a)).slice(0, 3), taken = [];
  for (const p of [...us, ...best]) {
    const cx = px(p), cy = py(p), text = p.name.split(" ").pop(), w = text.length * 6.2 + 2;
    const spot = [[cx + 7, cx + 7 + w], [cx - 7 - w, cx - 7]].find(([a, b]) => a >= left && b <= width &&
      !taken.some(([ta, tb, ty]) => a < tb && b > ta && Math.abs(ty - cy) < 11));
    if (!spot) continue;
    taken.push([...spot, cy]);
    svgEl("text", { x: spot[0], y: cy + 3, class: `name-tag${p.squad ? "" : " them"}` }, svg).textContent = text;
  }
}

// ---- putting the page together ----
function fillSelect(id, options, current, key) {
  const sel = document.getElementById(id);
  sel.innerHTML = options.map(([value, text]) => `<option value="${value}"${value === current ? " selected" : ""}>${text}</option>`).join("");
  sel.onchange = () => choose(key, sel.value);
}
function draw() {
  fillSelect("against", CHOICES.map(c => [c, shortName(c)]), choice.against, "against");
  const bar = document.getElementById("positions");
  bar.querySelectorAll("button").forEach(b => b.remove());
  for (const pos of POSITIONS) {
    const b = document.createElement("button");
    b.textContent = pos;
    b.className = pos === choice.pos ? "on" : "";
    b.onclick = () => choose("pos", pos);
    bar.appendChild(b);
  }
  const people = shown();
  const key = document.querySelector(".rctl .key");
  key.innerHTML = `<span class="them"><i></i>${shortName(choice.against)} ${people.filter(p => !p.squad).length}</span><span class="us"><i></i>${CLUB} ${people.filter(p => p.squad).length}</span>`;
  const pos = choice.pos, scoreOf = p => p.scores[pos];
  summary(people);
  // the charts, one at a time
  const rated = people.some(p => p.rating != null);
  const them = `<span class="them">${shortName(choice.against)}</span>`, us = `<span class="us">◆ your players</span>`;
  const group = (key, name, what) => ({ name: `${name} by position`,
    sub: `${what}, at each position: its ${name.toLowerCase()} attributes averaged with that position's weights`,
    draw: () => byPosition("chartBox", (p, at) => groupValue(p, at, name), name.toLowerCase(), atBest, undefined, true, undefined,
                           name === "Goalkeeping" ? ["GK"] : undefined),
    how: `Each row is a position, each player at his best position. A player's value is his ${name.toLowerCase()} attributes ` +
      `averaged with the position's weights (the Attributes page), so it counts what matters there; under half of that weight ` +
      `scouted = no value. The bar in the accent colour is ${them}: the line runs from the worst to the best, the box holds the middle half, and ` +
      `the white mark and number are the middle player. ${us} are on the lower lane, your best at each position big and named; the number at the far right is your best minus their ` +
      `middle (<span class="good">green</span> = you're ahead).` });
  const charts = {
    score: { name: "Role score by position", sub: "How good your players are at each position, against the others",
      draw: () => byPosition("chartBox", (p, at) => p.scores[at], "role score", atBest, undefined, true, 10),
      how: `Each row is a position. The bar in the accent colour is ${them}: the line runs from the worst to the best, the box holds the middle half, ` +
        `and the white mark and number are the middle player. ${us} are on the lower lane, your best big and named: right of the white mark = better than most of them. ` +
        `The number at the far right is your best minus their middle (<span class="good">green</span> = you're ahead). Click a position to pick it.` },
    technical: group("technical", "Technical", "Corners to Technique: on the ball"),
    mental: group("mental", "Mental", "Anticipation to Work Rate: reading the game and effort"),
    physical: group("physical", "Physical", "Pace, Acceleration, Stamina, Strength and the rest"),
    goalkeeping: group("goalkeeping", "Goalkeeping", "Handling, Reflexes, Aerial Reach and the rest (keepers only)"),
    wage: { name: `${pos} score vs wage`, sub: `Every player whose best position is ${pos}: who gives the most for the money`,
      draw: () => plot({ x: p => p.wage || null, y: scoreOf, xTitle: "wage p/w (log)", yTitle: `${pos} score`, wages: true,
                         zones: ["better and cheaper", "worse and dearer"] }),
      how: `<b>Higher = better</b>, <b>further left = cheaper</b>. The dashed lines are the middle of the others. ` +
        `<span class="good">Top left</span>: better and cheaper than most (good value: worth a look). ` +
        `<span class="bad">Bottom right</span>: worse and dearer. Pick the position at the top; hover a mark for the player.` },
    age: { name: "Your squad: age vs score", sub: "Every player of yours at his best position: who's young and good, who's older and fading",
      draw: () => plot({ x: p => p.age, y: p => p.scores[p.best], xTitle: "age", yTitle: "best score", who: p => p.squad }),
      how: (() => { const sq = people.filter(p => p.squad && p.age != null && p.scores[p.best] != null);
        const young = sq.filter(p => p.age <= 21).sort((a, b) => b.scores[b.best] - a.scores[a.best])[0], old = sq.filter(p => p.age >= 30).sort((a, b) => b.scores[b.best] - a.scores[a.best])[0];
        return `<b>Top left</b> = young and already good (keep them, give minutes); <b>top right</b> = your experienced core; <b>bottom right</b> = older ` +
          `and fading (replace before they decline). ${young ? `Best youngster: <b>${young.name}</b> (${young.age}, ${young.scores[young.best].toFixed(1)}). ` : ""}` +
          `${old ? `Best 30+: <b>${old.name}</b> (${old.age}, ${old.scores[old.best].toFixed(1)}): plan his successor.` : ""}`; })() },
    wages: { name: "Your squad: wage vs score", sub: "What you pay for what you get: every player of yours at his best position",
      draw: () => plot({ x: p => p.wage || null, y: p => p.scores[p.best], xTitle: "wage p/w (log)", yTitle: "best score", wages: true, who: p => p.squad }),
      how: (() => { const sq = people.filter(p => p.squad && p.wage && p.scores[p.best] != null);
        if (!sq.length) return "Your squad export needs a wage (Salary) column for this graph.";
        const dear = sq.slice().sort((a, b) => b.wage / b.scores[b.best] - a.wage / a.scores[a.best])[0];
        const alt = people.filter(p => !p.squad && p.best === dear.best && p.wage && p.scores[dear.best] >= dear.scores[dear.best] && p.wage < dear.wage).sort((a, b) => a.wage - b.wage)[0];
        return `<b>Higher</b> = better, <b>further right</b> = dearer. Most expensive for his score: <b>${dear.name}</b> (${dear.best} ${dear.scores[dear.best].toFixed(1)}, ${wageText(dear.wage)} p/w)` +
          (alt ? `; on your lists <b>${alt.name}</b> is as good for ${wageText(alt.wage)} p/w.` : "."); })() },
    ...(rated ? {
      rating: { name: `${pos} score vs average rating`, sub: "Whether the score matches how players do in matches",
        draw: () => plot({ x: p => p.rating, y: scoreOf, xTitle: "average rating", yTitle: `${pos} score` }),
        how: `Does a higher score mean better matches? Marks rising to the right (r near 1) say yes; a flat cloud (r near 0) says the score misses something.` },
    } : {}),
  };
  if (!charts[choice.chart]) choice.chart = "score";
  fillSelect("chart", Object.entries(charts).map(([k, c]) => [k, c.name]).concat(rated ? [] : [["", "Score vs average rating (once imported players have a Rating)"]]),
             choice.chart, "chart");
  document.querySelector('#chart option[value=""]')?.setAttribute("disabled", "");
  const c = charts[choice.chart];
  document.getElementById("chartTitle").textContent = c.name;
  document.getElementById("chartSub").textContent = c.sub;
  document.getElementById("chartHow").innerHTML = c.how + (rated ? "" : ` <br>The score vs average rating chart appears once imported players have a Rating ` +
    `(FM shows one for players who've played this season).`);
  document.getElementById("chartBox").innerHTML = "";
  c.draw();
}

// ---- the analysis on top: per position, the listed players against yours ----
function summary(people) {
  const fmtWage = w => w == null ? "–" : `${wageText(w)} p/w`;
  const last = n => n.split(" ").pop();
  const rows = POSITIONS.map(pos => {
    const them = people.filter(p => !p.squad && atBest(p, pos)).sort((a, b) => b.scores[pos] - a.scores[pos]);
    // your best there: whoever of yours who plays it scores highest (FM's positions, else his best and its neighbours, as the Lineup)
    const ours = people.filter(p => p.squad && p.scores[pos] != null && (p.plays || [p.best]).includes(pos))
      .sort((a, b) => b.scores[pos] - a.scores[pos]);
    const mine = ours[0], theirs = them[0], mid = them.length ? middleOf(them.map(p => p.scores[pos])) : null;
    const better = mine ? them.filter(p => p.scores[pos] > mine.scores[pos]) : them;
    const cheapest = better.filter(p => p.wage != null).sort((a, b) => a.wage - b.wage)[0];
    return { pos, them, mine, theirs, mid, better, cheapest, gap: mine && theirs ? theirs.scores[pos] - mine.scores[pos] : null };
  });
  const listed = rows.reduce((n, r) => n + r.them.length, 0);
  const upgrades = rows.filter(r => r.better.length && r.them.length);
  const biggest = rows.filter(r => r.gap != null && r.gap > 0).sort((a, b) => b.gap - a.gap)[0];
  const ahead = rows.filter(r => r.mine && r.them.length && r.gap <= 0).map(r => r.pos);
  const empty = rows.filter(r => !r.mine).map(r => r.pos);
  const elsewhere = r => r.mine && r.mine.best !== r.pos ? ` <span class="faint">(best ${r.mine.best})</span>` : "";
  const sign = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}`;
  const lead = !listed ? `No listed players to compare with yet: import a search or shortlist.` :
    `<b>${listed}</b> listed player${listed > 1 ? "s" : ""} (${shortName(choice.against)}), each at his best position. ` +
    (upgrades.length ? `Better than your best at <b>${upgrades.length}</b> position${upgrades.length > 1 ? "s" : ""}: ` +
      upgrades.map(r => `${r.pos} (${r.better.length})`).join(", ") + ". " : `No one listed beats your best anywhere. `) +
    (biggest ? `Biggest gap: <span class="bad">${biggest.pos}</span>, ${biggest.theirs.name} is <b>${sign(biggest.gap)}</b> on ${biggest.mine.name}. ` : "") +
    (ahead.length ? `You're ahead of everyone listed at <span class="good">${ahead.join(", ")}</span>. ` : "") +
    (empty.length ? `<span class="faint">No player of yours plays ${empty.join(", ")}.</span>` : "") +
    (listed ? `<br><b>Next step:</b> ` + (biggest && biggest.cheapest ? `at <b>${biggest.pos}</b>, ${biggest.cheapest.name} (${biggest.cheapest.scores[biggest.pos].toFixed(1)}, ${fmtWage(biggest.cheapest.wage)}) ` +
      `is the cheapest who beats ${last(biggest.mine.name)}: worth a scout report.` : upgrades.length ? `look at ${upgrades.map(r => r.pos).join(", ")}: someone listed beats your best there.` :
      `no one here beats your eleven: search for better players (Players › Search has the minimums to type into FM).`) : "");
  const body = rows.map(r => `<tr data-pos="${r.pos}" class="${r.pos === choice.pos ? "on" : ""}">
      <td class="pos-cell">${r.pos}</td>
      <td class="num">${r.them.length || "–"}</td>
      <td class="num">${r.mid == null ? "–" : r.mid.toFixed(1)}</td>
      <td>${r.theirs ? `${r.theirs.name} <b>${r.theirs.scores[r.pos].toFixed(1)}</b> <span class="faint">${r.theirs.age} · ${fmtWage(r.theirs.wage)}</span>` : "–"}</td>
      <td class="us">${r.mine ? `${r.mine.name} <b>${r.mine.scores[r.pos].toFixed(1)}</b>${elsewhere(r)}` : `<span class="faint">none</span>`}</td>
      <td class="num ${r.gap == null ? "" : r.gap > 0 ? "down" : "up"}" title="their best minus your best">${r.gap == null ? "–" : sign(-r.gap)}</td>
      <td class="num">${r.them.length ? r.better.length : "–"}</td>
      <td>${r.cheapest ? `${r.cheapest.name} <b>${r.cheapest.scores[r.pos].toFixed(1)}</b> <span class="faint">${fmtWage(r.cheapest.wage)}</span>` : "–"}</td>
    </tr>`).join("");
  const box = document.getElementById("summary");
  box.innerHTML = `<div class="ttitle">Listed players by position</div>
    <div class="lead-line">${lead}</div>
    <div class="wrapx"><table class="market"><thead><tr><th>Position</th><th class="num">Listed</th><th class="num">Middle</th><th>Their best</th>
      <th>Your best</th><th class="num">You ±</th><th class="num">Better than yours</th><th>Cheapest of those</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="subtitle" style="margin:8px 0 0">Listed players count at their best position; <b>Your best</b> is whoever of yours who plays there
      scores highest (FM's positions, else his best and its neighbours; "best X" = his best is elsewhere). <b>Middle</b>: the middle listed player's score;
      <b>You ±</b>: your best minus their best (<span style="color:var(--green)">green</span> = you're ahead); <b>Cheapest of those</b>: the lowest wage among
      the listed players better than your best. Click a row to pick that position for the charts.</div>`;
  box.querySelectorAll("tr[data-pos]").forEach(tr => tr.onclick = () => choose("pos", tr.dataset.pos));
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  const page = window.fmNavTarget && fmNavTarget(e.key);  // the menu's keys (a group's: its next sub-tab)
  if (page && page !== "charts") location.href = `${page}.html`;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {  // the previous or next position, round the end
    const n = POSITIONS.length, i = POSITIONS.indexOf(choice.pos) + (e.key === "ArrowRight" ? 1 : -1);
    choose("pos", POSITIONS[(i + n) % n]);
  }
});
let redraw;
addEventListener("resize", () => { clearTimeout(redraw); redraw = setTimeout(draw, 150); });
draw();
</script>
</body>
</html>
