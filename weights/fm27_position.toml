# Player scoring weights for FM27 (an alternative to fm27_test, for comparison): FM's 10 position groups, from two sources:
#   - match impact by position (docs/attribute_importance_by_position.csv): Purity's test in FM-Arena's "Attribute
#     importance by position in FM27" thread (https://fm-arena.com/threads/attribute-importance-by-position-in-fm27-a-test-on-my-own-tactic.125/,
#     Nov 2026): goal difference per season for +1 in one player's attribute, 200,000 matches, a 3-4-2-1. Results the
#     thread confirms count in full, unconfirmed ones half; a loss counts as none. Hidden attributes aren't exported: left out.
#   - CA cost (docs/ca_costs_fm27.csv): FM's own view of which attributes count at each position. An attribute's impact
#     counts 0.5x where FM doesn't count it, up to 1.5x where it counts most. This is what tells DL/DR from WBL/WBR
#     and AMC from AML/AMR, which the test didn't separate.
# Tested groups standing in for positions: DC = CB, DL/DR and WBL/WBR = WB, DM, AMC and AML/AMR = AM, ST; MC = the
# average of DM and AM, ML/MR = of WB and AM. Each position's top weight is 10. Goalkeepers: CA cost only (not tested).
# Caveat: the test found DMs barely move results apart from Acceleration, so DM is close to an Acceleration score and
# fast players of any position can rank best at DM.
# Score = sum(attribute * weight) / sum(weights). Attributes not listed don't count.

