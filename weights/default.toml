# FMAnalyst's default weights for FM27: FM's 10 position groups, weighted by both
#   - CA cost (docs/ca_costs_fm27.csv): which attributes FM counts at each position, and
#   - match impact (docs/attribute_impact_test.csv): harvestgreen22's FM27 attribute test, posted on sortitoutsi
#     (https://sortitoutsi.net/content/78219/fm27-attribute-test-tactical-understanding-training-system-preset-tactics-ai-reverse-engineering-engine-for-test,
#     4 Nov 2026; about 51,000 matches, preset Gegenpress 4-2-4) and tabled by squirrel_plays in FM-Arena's "Player Attributes"
#     thread (https://fm-arena.com/threads/player-attributes.59/): the change in win rate when every player's attribute
#     moves from 12 to 1-18, the rest at 12 (tested at 1, 6, 12, 18; linear between).
# Outfield weight = CA cost x (impact + 1), scaled so each position's top weight is 10. Impact = the gain from 9 to 15
# (where most players are); a loss counts as none. The + 1 keeps a little weight for attributes the test found no
# gain in (Marking, Tackling, Passing...). Leadership and Teamwork aren't in the test: CA cost only.
# Goalkeepers: CA cost only (the test is outfield).
# Outfield attributes: only the 18 that the Search - Outfield Players View shows (Acceleration, Anticipation, Composure,
# Decisions, Dribbling, Finishing, First Touch, Heading, Jumping Reach, Off The Ball, Pace, Passing, Positioning,
# Stamina, Strength, Tackling, Teamwork, Work Rate), rescaled to a top weight of 10 per position. So searches exported
# with that view score at every position, and the squad (exported with every attribute) is judged on the same ones.
# Score = sum(attribute * weight) / sum(weights). Attributes not listed don't count.

