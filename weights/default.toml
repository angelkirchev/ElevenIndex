# Staff jobs: job score = sum(value x weight) / sum(weights), with every weighted attribute known. The weights follow
# FM27's key attributes for each job (the ones a staff profile shows in green): the job's own skill counts 4, FM's
# other key attributes for it 2, and attributes that help 1. A coach group's two coaching attributes are its skill;
# Negotiating and Adaptability (key for a director of football and a scout) aren't on the staff view, so they're left out.

