# ElevenIndex's default weights for FM27.
#
# A player's score at a position = sum(attribute x weight) / sum(weights), on FM's 1-20 scale. Each attribute's
# weight at a position = its CA cost there x its attribute weight below, so one number per attribute moves it at every
# position, keepers' included:
#   - CA cost (docs/ca_costs_fm27.csv, fixed): how much FM charges for the attribute at each position, as FM Scout tables
#     it (unchanged for many FM versions; 1 = the smallest cost, blank = none). No cost there = it doesn't count there.
#   - Attribute weight (below, 1-20, like FM's attributes; not listed = doesn't count). Change it on the Attributes page.
# The values = match impact: harvestgreen22's FM27 attribute test, final report (FM-Arena, "FM27 New Player Attribute
#   (1,4,8,12,16,20) Test", updated 21 Nov 2026; https://fm-arena.com/threads/incomplete-in-progress-fm27-new-player-attribute-1-4-8-12-16-20-test-updated-21-11-2026.276/),
#   run with lqf0624's fm-tactics-lab: a team with every attribute at 12 against the 19 Premier League sides' own
#   tactics, 181,830 matches in all, each attribute set to 1, 4, 8, 12, 16 and 20 in turn; docs/attribute_test_fm27_2.csv.
#   As he advises: an attribute counts when home and away matches together (equally weighted) gain at least the test's
#   error from 1 to 20 (2.5 points of win rate), and its weight is the home matches' gain (the more reliable ranking),
#   scaled to 20 for the biggest (Pace, 49.8 points) and rounded; at least 1. In order: Pace and Acceleration first;
#   Stamina; Jumping Reach and Anticipation; Strength and Concentration; then Balance, Work Rate, Finishing, Dribbling,
#   Agility, Long Shots, Vision and Composure.
#   Not listed: within the test's error or worse (Decisions, Passing, Bravery, Marking, Heading, Teamwork, Positioning,
#   Crossing, Tackling, Technique, First Touch, Aggression, Off The Ball, Flair), the set pieces and Leadership it didn't
#   test, and the ones without a CA cost, which can't count (Determination, Natural Fitness, the weaker foot and the
#   hidden ones). A weaker foot only matters at 1 to 3 (all its gain is from 1 to 12): the scout report says so.
#   The first test (4 Nov 2026, docs/attribute_impact_test.csv) ranked them much the same.
# Goalkeeping attributes (Handling, Reflexes, Aerial Reach, Command of Area, Communication, Kicking, One on Ones, Throwing):
#   15, as the test has no keepers; with them a keeper's biggest weights are Handling and Reflexes, then Acceleration.
#   Keepers share the other attributes' weights with outfield players (Decisions counts little for them too).
# The pages show weights scaled so each position's biggest is 10.

outfield_positions = ["CD", "DL/DR", "WBL/WBR", "DM", "MC", "ML/MR", "AMC", "AML/AMR", "ST"]

[attributes]
Pace = 20
Acceleration = 19
"Aerial Reach" = 15
"Command of Area" = 15
Communication = 15
Handling = 15
Kicking = 15
"One on Ones" = 15
Reflexes = 15
Throwing = 15
Stamina = 10
"Jumping Reach" = 9
Anticipation = 8
Concentration = 6
Strength = 6
Balance = 5
Agility = 4
Dribbling = 4
Finishing = 4
"Work Rate" = 4
"Long Shots" = 3
Vision = 3
Composure = 2

# vs Age: the score a player is expected to have reached by each age. It rises to a peak of 13.8 at 24 (where a good
# Championship or low Premier League player sits with these weights) and grows more slowly as he nears it:
# expected = 13.8 - 0.045 x (24 - age)^2. Older than 24 counts as 24, younger than 15 as 15.
[age_benchmark]
15 = 10.2
16 = 10.9
17 = 11.6
18 = 12.2
19 = 12.7
20 = 13.1
21 = 13.4
22 = 13.6
23 = 13.8
24 = 13.8

# Staff: FM shows a staff member's attributes as words. Each counts as the middle of the 1-20 range it stands for.
[staff_words]
Elite = 20
Outstanding = 18.5  # 18-19
"Very Good" = 16  # 15-17
Good = 13  # 12-14
Average = 10.5  # 10-11
Competent = 8  # 7-9
Reasonable = 5  # 4-6
Unsuited = 2  # 1-3

# Each staff job's full name, beside the short label its column uses
