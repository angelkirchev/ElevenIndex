# FMAnalyst's default weights for FM27.
#
# A player's score at a position = sum(attribute x weight) / sum(weights), on FM's 1-20 scale. Each attribute's
# weight at a position = its CA cost there x its attribute weight below, so one number per attribute moves it at every
# position, keepers' included:
#   - CA cost (docs/ca_costs_fm27.csv, fixed): how much FM charges for the attribute at each position, as FM Scout tables
#     it (unchanged for many FM versions; 1 = the smallest cost, blank = none). No cost there = it doesn't count there.
#   - Attribute weight (below, 1-20, like FM's attributes; not listed = doesn't count). Change it on the Attributes page.
# The values = match impact, our main distribution: harvestgreen22's FM27 attribute test, posted on sortitoutsi
#   (https://sortitoutsi.net/content/78219/fm27-attribute-test-tactical-understanding-training-system-preset-tactics-ai-reverse-engineering-engine-for-test#comment_910309,
#   4 Nov 2026; about 51,000 matches, preset Gegenpress 4-2-4) and tabled by squirrel_plays in FM-Arena's "Player Attributes"
#   thread (https://fm-arena.com/threads/player-attributes.59/), docs/attribute_impact_test.csv: the change in win rate
#   when every player's attribute goes from 12 to 1-18. Value = the whole swing from 1 to 18 (the 1>6, 6>12 and 12>18
#   gains together), scaled to 20 for the biggest (Pace, 59.4 points) and rounded; at least 1. So the attributes that
#   hurt a lot when low (Work Rate, Anticipation, Strength) count as well as the ones that keep helping when high (Pace,
#   Acceleration, Stamina, Jumping Reach). In the test's order: Pace, Acceleration and Stamina first; Jumping Reach;
#   Anticipation, Strength and Work Rate; then Concentration and Balance.
#   Not listed: the six that do worse at 18 than at 1 in the test (Positioning, Passing, Tackling, First Touch, Technique,
#   Off The Ball), the ones it didn't test (Teamwork, Leadership…), and the ones without a CA cost, which can't count
#   (Natural Fitness, Determination, and the hidden Pressure, Important Matches and Consistency).
#   The 18 attributes the Search - Outfield Players View shows carry at least 85% of every position's weight, so searched
#   players still score everywhere (the 85% rule).
# Goalkeeping attributes (Handling, Reflexes, Aerial Reach, Command of Area, Communication, Kicking, One on Ones, Throwing):
#   15, as the test has no keepers; with them a keeper's biggest weights are Handling and Reflexes, then Acceleration.
#   Keepers share the other attributes' weights with outfield players (Decisions counts little for them too).
# The pages show weights scaled so each position's biggest is 10.

outfield_positions = ["DC", "DL/DR", "WBL/WBR", "DM", "MC", "ML/MR", "AMC", "AML/AMR", "ST"]

[attributes]
Pace = 20
Acceleration = 16
"Aerial Reach" = 15
"Command of Area" = 15
Communication = 15
Handling = 15
Kicking = 15
"One on Ones" = 15
Reflexes = 15
Stamina = 15
Throwing = 15
"Jumping Reach" = 11
Anticipation = 8
Strength = 8
"Work Rate" = 7
Concentration = 6
Balance = 5
Dribbling = 4
Agility = 3
Finishing = 3
"Long Shots" = 3
Crossing = 2
Heading = 2
Bravery = 1
Composure = 1
Decisions = 1
Marking = 1
Vision = 1

# vs Age: the score a player is expected to have reached by each age. It rises to a peak of 13.8 at 24 (where a good
# Championship or low Premier League player sits with these weights) and grows more slowly as he nears it:
# expected = 13.8 - 0.045 x (24 - age)^2. Older than 24 counts as 24, younger than 15 as 15.
[age_benchmark]
15 = 10.2
16 = 10.9
17 = 11.6
18 = 12.2
19 = 12.7
20 = 13.1
21 = 13.4
22 = 13.6
23 = 13.8
24 = 13.8

# Staff: FM shows a staff member's attributes as words. Each counts as the middle of the 1-20 range it stands for.
[staff_words]
Elite = 20
Outstanding = 18.5  # 18-19
"Very Good" = 16  # 15-17
Good = 13  # 12-14
Average = 10.5  # 10-11
Competent = 8  # 7-9
Reasonable = 5  # 4-6
Unsuited = 2  # 1-3

