<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
  <!-- ElevenIndex's XI mark (score.py inlines it): a cream X and a lime I on the near-black square. docs/logo-icon.svg
       is the same for the app icon, docs/ElevenIndex.ico the .exe's, docs/elevenindex-banner.png the README's banner. -->
  <defs><clipPath id="xi-x"><rect x="21.5" y="24" width="38" height="52"/></clipPath></defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#0f1412" stroke="#2a332f" stroke-width="2"/>
  <g clip-path="url(#xi-x)" stroke="#f2efe7" stroke-width="12.5" stroke-linecap="butt">
    <line x1="21.5" y1="16" x2="59.5" y2="84"/><line x1="59.5" y1="16" x2="21.5" y2="84"/>
  </g>
  <rect x="65.5" y="24" width="12.5" height="52" rx="2" fill="#c5f04f"/>
</svg>
