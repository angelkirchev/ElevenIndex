<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- FMAnalyst icon: a shield, a rising chart line breaking out of it, and a ball. Navy for light backgrounds;
       docs/logo-icon-light.svg is the same in light colours for dark ones. -->
  <defs>
    <path id="shield" d="M14 16 Q50 6 86 16 L86 50 Q84 78 50 95 Q16 78 14 50 Z"/>
    <clipPath id="in"><use href="#shield"/></clipPath>
    <polyline id="line" points="5,88 33,61 46,70 80,32" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon id="head" points="93,15 72,22 86,36"/>
  </defs>
  <use href="#shield" fill="#1b3d66"/>
  <!-- outside the shield the line is navy, inside it's white -->
  <use href="#line" stroke="#1b3d66"/>
  <use href="#head" fill="#1b3d66"/>
  <g clip-path="url(#in)">
    <use href="#line" stroke="#fff"/>
    <use href="#head" fill="#fff"/>
  </g>
  <circle cx="33" cy="61" r="5" fill="#1b3d66" stroke="#fff" stroke-width="3"/>
  <circle cx="46" cy="70" r="5" fill="#1b3d66" stroke="#fff" stroke-width="3"/>
  <!-- the ball: a centre pentagon and five patches at the edge -->
  <circle cx="55" cy="30" r="10" fill="#fff"/>
  <polygon points="55,25.6 59.2,28.6 57.6,33.6 52.4,33.6 50.8,28.6" fill="#1b3d66"/>
  <g fill="#1b3d66">
    <path d="M51.5 20.6 Q55 19.6 58.5 20.6 L55 22.4 Z"/>
    <path d="M64.4 25.8 Q65.4 29.4 64.6 32.6 L62.6 29 Z"/>
    <path d="M61.2 38.4 Q58.4 40 55 40 L58.6 36.6 Z"/>
    <path d="M48.8 38.4 Q51.6 40 55 40 L51.4 36.6 Z"/>
    <path d="M45.6 25.8 Q44.6 29.4 45.4 32.6 L47.4 29 Z"/>
  </g>
  <g stroke="#1b3d66" stroke-width="1" fill="none">
    <path d="M55 25.6 V22.4 M59.2 28.6 L62.6 29 M57.6 33.6 L58.6 36.6 M52.4 33.6 L51.4 36.6 M50.8 28.6 L47.4 29"/>
  </g>
</svg>
